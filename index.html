<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Super Video Filter</title>
<style>
  :root{
    --bg:#000; --panel:#111; --panel2:#1a1a1a; --line:#2a2a2a;
    --fg:#e8e8e8; --dim:#8a8a8a; --acc:#d7ff3f; --rec:#ff2d2d;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}

  /* ---------- viewer ---------- */
  #stage{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #gl{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
  #video{display:none}
  #overlay{position:absolute;inset:0;pointer-events:none;font-family:var(--mono)}
  .osd{position:absolute;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;font-size:clamp(12px,2.4vw,20px);letter-spacing:.08em;opacity:.95}
  .osd.tl{top:14px;left:16px}.osd.tr{top:14px;right:16px}.osd.bl{bottom:14px;left:16px}.osd.br{bottom:14px;right:16px}
  .osd .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--rec);margin-right:.4em;animation:blink 1s steps(1) infinite;vertical-align:baseline}
  @keyframes blink{50%{opacity:0}}
  #osdFont-vhs .osd{font-family:"Courier New",Courier,monospace;font-weight:bold;color:#fff}
  #osdFont-cam .osd{font-family:var(--mono);color:#dfe}
  .brk{position:absolute;width:28px;height:28px;border:2px solid rgba(255,255,255,.7)}
  .brk.tl{top:8%;left:6%;border-right:0;border-bottom:0}.brk.tr{top:8%;right:6%;border-left:0;border-bottom:0}
  .brk.bl{bottom:8%;left:6%;border-right:0;border-top:0}.brk.br{bottom:8%;right:6%;border-left:0;border-top:0}
  .cross{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);background:
    linear-gradient(#8f8 0 0) center/100% 1px no-repeat, linear-gradient(#8f8 0 0) center/1px 100% no-repeat;opacity:.8}
  .hud-ring{position:absolute;left:50%;top:50%;width:140px;height:140px;border:1px solid rgba(140,255,140,.5);border-radius:50%;transform:translate(-50%,-50%)}
  .hud-bar{position:absolute;left:50%;top:6%;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end}
  .hud-bar i{display:block;width:1px;background:rgba(140,255,140,.7)}
  #splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px;z-index:5}
  #splash h1{font-size:clamp(22px,6vw,44px);margin:0;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:3px 0 var(--rec),-3px 0 #2df;animation:shake 3s infinite}
  @keyframes shake{0%,94%,100%{transform:none}95%{transform:translate(2px,-1px) skewX(4deg)}97%{transform:translate(-3px,1px)}}
  #splash p{color:var(--dim);max-width:44ch;margin:0;font-size:13px;line-height:1.5}
  .big{font:inherit;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:var(--acc);color:#000;border:0;border-radius:6px;padding:14px 22px;cursor:pointer}
  .big:active{transform:scale(.97)}
  #err{color:var(--rec);font-size:12px;max-width:48ch;display:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}

  /* ---------- controls ---------- */
  #ui{background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto;max-height:52vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #bar{display:flex;gap:6px;padding:8px 10px;align-items:center;border-bottom:1px solid var(--line)}
  #bar button{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer;flex:1;white-space:nowrap}
  #bar button:active{background:#222}
  #bar button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
  #bar button.on{border-color:var(--acc);color:var(--acc)}
  #presets{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:0 0 auto;align-items:center}
  #presets::-webkit-scrollbar{display:none}
  #bgs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:0 0 auto;align-items:center}
  #bgs::-webkit-scrollbar{display:none}
  #presets .lbl,#bgs .lbl{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding-right:4px;white-space:nowrap}
  .chip.bg{border-color:#3a3a3a}.chip.bg.on{background:#2df;border-color:#2df}
  .chip.wait{opacity:.5}
  .chip{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
  #sliders{overflow-y:auto;padding:8px 12px 10px;-webkit-overflow-scrolling:touch}
  .row{display:grid;grid-template-columns:9.5em 1fr 3.2em;align-items:center;gap:10px;padding:5px 0}
  .row label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row output{font-size:11px;color:var(--fg);text-align:right}
  .row.head{padding-top:10px}
  .row.head label{color:var(--acc)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#333;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--fg);margin-top:-9px;border:2px solid #000}
  input[type=range]::-moz-range-track{height:4px;background:#333;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:2px solid #000}
  .row input[type=text]{font:inherit;font-size:12px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;grid-column:2/4}
  @media (min-width:900px) and (orientation:landscape){
    body{flex-direction:row}
    #ui{max-height:none;width:360px;border-top:0;border-left:1px solid var(--line)}
    #presets,#bgs{flex-wrap:wrap}
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <div id="overlay"></div>
  <div class="flash" id="flash"></div>
  <div id="splash">
    <h1>Super Video Filter</h1>
    <p>Point your camera at anything and make it look like a lost tape. Glitch it. VHS it. Send it to the Backrooms.</p>
    <button class="big" id="start">Start camera</button>
    <p id="err"></p>
    <p style="font-size:11px">Nothing is uploaded — everything happens on this device.</p>
  </div>
</div>

<div id="ui">
  <div id="bar">
    <button id="flip">Flip</button>
    <button id="snap">Photo</button>
    <button id="record">● Rec</button>
    <button id="fs">Full</button>
    <button id="mutate" title="Sliders keep drifting to new random settings">Mutate</button>
    <button id="hide">Hide</button>
  </div>
  <div id="presets"></div>
  <div id="bgs"></div>
  <div id="sliders"></div>
</div>

<script>
// ============================================================
//  FILTER DEFINITIONS
//  Each preset sets uniform values; each has its own slider list.
// ============================================================

const PRESETS = [
  {id:'clean', name:'Clean', osd:'none',
   sliders:['grain','vignette','contrast','brightness','saturation','blur','pixelate'], v:{grain:0,vignette:0}},
  {id:'vhs', name:'VHS', osd:'vhs',
   sliders:['tracking','bleed','scanlines','wobble','tapeNoise','saturation','contrast','blur','vignette'],
   v:{tracking:.5,bleed:.6,scanlines:.5,wobble:.35,tapeNoise:.5,saturation:1.15,blur:.35,vignette:.35,grain:.25,contrast:1.1}},
  {id:'glitch', name:'Glitch', osd:'none',
   sliders:['blocks','rgbSplit','smear','tear','invertFlash','posterize','scanlines','grain'],
   v:{blocks:.55,rgbSplit:.5,smear:.4,tear:.4,invertFlash:.15,grain:.2,vignette:.2}},
  {id:'backrooms', name:'Backrooms', osd:'vhs',
   sliders:['yellow','flicker','lowres','interlace','tapeNoise','vignette','contrast','blur','grain'],
   v:{yellow:.8,flicker:.5,lowres:.55,interlace:.5,tapeNoise:.3,vignette:.55,contrast:1.15,blur:.3,grain:.35,saturation:.8,tracking:.15,wobble:.15}},
  {id:'horror', name:'Analog Horror', osd:'vhs',
   sliders:['tapeNoise','tracking','warp','tear','interlace','invertFlash','scanlines','contrast','vignette','mono'],
   v:{tapeNoise:.7,tracking:.7,warp:.35,tear:.5,interlace:.6,invertFlash:.25,scanlines:.6,contrast:1.4,vignette:.7,grain:.5,saturation:.4,bleed:.5,wobble:.5}},
  {id:'seccam', name:'Security Cam', osd:'cam',

  {id:'night', name:'Night Vision', osd:'cam',
   sliders:['nightvision','grain','brightness','contrast','vignette','blur','scanlines'],

  {id:'lowfi', name:'8-bit', osd:'none',
   sliders:['pixelate','posterize','saturation','contrast','scanlines','grain'],

  // ---- trippy ----
  {id:'acid', name:'Acid', osd:'none', group:'trippy',
   sliders:['hueCycle','swirl','rainbow','chromaWave','saturation','ripple','contrast'],
   v:{hueCycle:.5,swirl:.35,rainbow:.55,chromaWave:.4,saturation:1.6,ripple:.15,contrast:1.15,vignette:.2}},
  {id:'kaleido', name:'Kaleidoscope', osd:'none', group:'trippy',
   sliders:['kaleido','hueCycle','swirl','mirror','saturation','ripple','tunnel'],
   v:{kaleido:.6,hueCycle:.25,swirl:.15,saturation:1.4,vignette:.25}},
  {id:'solar', name:'Solar Flare', osd:'none', group:'trippy',
   sliders:['solarize','posterize','rgbSplit','hueCycle','contrast','grain','strobe'],
   v:{solarize:.9,posterize:.4,rgbSplit:.3,hueCycle:.15,contrast:1.3,grain:.2,vignette:.3}},
  {id:'dream', name:'Dream Ripple', osd:'none', group:'trippy',
   sliders:['ripple','ghost','chromaWave','blur','saturation','tunnel','warp'],
   v:{ripple:.6,ghost:.7,chromaWave:.5,blur:.3,saturation:1.3,warp:.1,vignette:.3}},
  {id:'tunnel', name:'Wormhole', osd:'none', group:'trippy',
   sliders:['tunnel','rainbow','swirl','hueCycle','kaleido','strobe','contrast'],
   v:{tunnel:.8,rainbow:.6,swirl:.5,hueCycle:.35,contrast:1.2,vignette:.3}},

   v:{fisheye:.7,gateWeave:.6,grain:.3,contrast:1.1,brightness:1.05,lowres:.2,vignette:.4}},

// ============================================================
//  SHADER
// ============================================================
const VERT = `
attribute vec2 p; varying vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

const FRAG = `
precision highp float;
varying vec2 v;
uniform sampler2D tex;   // camera
uniform sampler2D prev;  // last frame (for ghost/smear)
uniform sampler2D mask;  // person segmentation (1=person)
uniform sampler2D bg;    // virtual background scene
uniform float bgMode;    // 0 none, 1 image, 2 static, 3 void
uniform float maskSoft, maskShift, bgScroll;
uniform vec2 res; uniform float t; uniform float flipX;
uniform float grain,vignette,contrast,brightness,saturation,blur,pixelate;
uniform float tracking,bleed,scanlines,wobble,tapeNoise;
uniform float blocks,rgbSplit,smear,tear,invertFlash;
uniform float yellow,flicker,lowres,interlace;
uniform float nightvision,thermal,sepia,scratches,gateWeave,mono,posterize,warp,fisheye,edges,ghost;
uniform float hueCycle,kaleido,swirl,ripple,solarize,rainbow,mirror,chromaWave,strobe,tunnel,gameboy,nes,psx,crt,halftone,outline,irGlow,motionBox;

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float hash1(float x){ return fract(sin(x*12.9898)*43758.5453); }
vec3 hueRot(vec3 c, float a){ // rotate hue in YIQ
  const vec3 k = vec3(0.57735); float ca=cos(a), sa=sin(a);
  return c*ca + cross(k,c)*sa + k*dot(k,c)*(1.-ca); }
float bayer4(vec2 p){ vec2 q=floor(mod(p,4.)); float i=q.x+q.y*4.;
  // 4x4 ordered dither via arithmetic (index -> threshold)
  float x=q.x, y=q.y; float v = mod(x*2.+y*3.+ (x>=2.?1.:0.)*4. + (y>=2.?1.:0.)*8., 16.);
  return (v+0.5)/16.; }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }

vec3 sampleBG(vec2 uv){
  if(bgMode<1.5){ return texture2D(bg, vec2(uv.x, 1.-uv.y)).rgb; }
  if(bgMode<2.5){ float n = hash(floor(uv*res/2.)+fract(t*13.)*50.); return vec3(n*0.9); }
  // void grid
  vec2 g = fract(uv*vec2(16.,9.) + vec2(0., t*0.15*bgScroll)); float line = step(0.96,g.x)+step(0.96,g.y);
  return vec3(0.02,0.02,0.04) + vec3(0.1,0.9,0.5)*min(line,1.)*0.5;
}
vec3 sampleCam(vec2 uv){
  uv = clamp(uv,0.001,0.999);
  if(flipX>0.5) uv.x = 1.-uv.x;
  vec3 c = texture2D(tex,uv).rgb;
  if(bgMode>0.5){
    float m = texture2D(mask,uv).r;
    m = smoothstep(0.5-maskSoft*0.45+maskShift*0.3, 0.5+maskSoft*0.45+maskShift*0.3, m);
    vec2 buv = uv; if(flipX>0.5) buv.x = 1.-buv.x;
    c = mix(sampleBG(buv), c, m);
  }
  return c;
}
vec3 samplePrev(vec2 uv){ return texture2D(prev,clamp(uv,0.,1.)).rgb; }

void main(){
  vec2 uv = v;
  vec2 px = 1./res;
  float ft = floor(t*24.); // "frame" time for stepped effects

  // ---- geometry: fisheye, gate weave, wobble, warp, tear, blocks ----
  if(crt>0.){ vec2 c=uv-0.5; float r2=dot(c,c); uv = 0.5 + c*(1.+crt*0.22*r2); }
  if(mirror>0.){ float m = abs(uv.x-0.5)+0.5; uv.x = mix(uv.x, 1.-m, mirror); }
  if(kaleido>0.){ vec2 c=uv-0.5; float ang=atan(c.y,c.x), r=length(c); float n=2.+floor(kaleido*8.); float seg=6.2831853/n;
                  ang = mod(ang, seg); ang = abs(ang-seg*0.5); ang += t*0.2*kaleido; uv = 0.5 + vec2(cos(ang),sin(ang))*r; }
  if(swirl!=0.){ vec2 c=uv-0.5; float r=length(c); float a=atan(c.y,c.x) + swirl*3.*(1.-smoothstep(0.,0.7,r)) + sin(t*0.7)*swirl*0.5; uv = 0.5+vec2(cos(a),sin(a))*r; }
  if(tunnel>0.){ vec2 c=uv-0.5; float r=length(c); float z = fract(r*3. - t*0.6*tunnel); uv = mix(uv, 0.5 + normalize(c+0.0001)*z*0.5, tunnel*0.6); }
  if(ripple>0.){ vec2 c=uv-0.5; float r=length(c); uv += normalize(c+0.0001)*sin(r*40.-t*5.)*0.012*ripple; }
  if(psx>0.){ vec2 g = res/ (2.+psx*5.); uv = (floor(uv*g + (noise(vec2(floor(t*15.),uv.y*4.))-.5)*psx*1.5)+.5)/g; }
  if(fisheye>0.){ vec2 c=uv-0.5; float r=length(c); uv = 0.5 + c*(1.+ fisheye*1.2*r*r) / (1.+fisheye*0.35); }
  if(gateWeave>0.){ uv += vec2(noise(vec2(t*3.,1.))-.5, noise(vec2(t*2.3,7.))-.5)*0.012*gateWeave; }
  if(wobble>0.){ uv.x += sin(uv.y*40.+t*9.)*0.0025*wobble + (noise(vec2(t*15.,uv.y*3.))-.5)*0.01*wobble;
                 float band = step(0.985, noise(vec2(t*2., floor(uv.y*20.))));
                 uv.x += band*(noise(vec2(t*30.,uv.y*100.))-.5)*0.15*wobble; }
  if(warp>0.){ uv += vec2(noise(uv*3.+t*.6), noise(uv*3.-t*.5))*0.12*warp - 0.06*warp; }
  if(tear>0.){ float ty = hash1(ft*0.37); float th = 0.02+0.15*hash1(ft*0.91);
               if(abs(uv.y-ty)<th && hash1(ft)<tear) uv.x += (hash1(ft*1.7)-.5)*0.25*tear; }
  if(blocks>0.){ vec2 bs = vec2(6.+floor(hash1(ft)*10.), 8.+floor(hash1(ft*3.)*12.));
                 vec2 cell = floor(uv*bs); float r = hash(cell+ft);
                 if(r > 1.-blocks*0.35){ uv += (vec2(hash(cell+1.7+ft), hash(cell+9.1+ft))-.5)*0.2*blocks; } }
  if(tracking>0.){ float band = smoothstep(0.,0.15, 1.-abs(fract(uv.y - t*0.35)*2.-1.)); // rolling bar
                   float on = step(1.-tracking, hash1(floor(t*2.)));
                   uv.x += band*on*(noise(vec2(t*40.,uv.y*200.))-.5)*0.08*tracking;
                   uv.y += band*on*0.004*tracking; }

  // ---- resolution: pixelate / low-res ----
  float pxs = max(pixelate*40., lowres*4.5);
  if(pxs>0.){ vec2 g = res/pxs; uv = (floor(uv*g)+.5)/g; }

  // ---- sampling: blur / bleed / rgb split ----
  vec3 col;
  float sp = blur*3.5*px.x*(res.x/640.) + bleed*3.*px.x*(res.x/640.);
  float split = rgbSplit*(0.01+0.02*hash1(ft*.5)) * (hash1(ft*1.3)<0.9?1.:3.);
  if(sp>0. || split>0.){
    float r = sampleCam(uv+vec2(split+sp,0.)).r + sampleCam(uv+vec2(split-sp,0.)).r;
    float g = sampleCam(uv+vec2(0.,0.)).g + sampleCam(uv+vec2(sp*0.5,sp*0.5)).g;
    float b = sampleCam(uv-vec2(split+sp,0.)).b + sampleCam(uv-vec2(split-sp,0.)).b;
    col = vec3(r,g,b)*0.5;
    if(bleed>0.){ vec3 wide = (sampleCam(uv+vec2(sp*2.5,0.))+sampleCam(uv-vec2(sp*2.5,0.)))*.5;
                  col = mix(col, vec3(col.r, mix(col.g,wide.g,.5), wide.b), bleed*0.7); }
  } else col = sampleCam(uv);

  // ---- edge detect ----
  if(edges>0.){
    float d = 1.5; vec3 a=sampleCam(uv+px*vec2(-d,0)), b=sampleCam(uv+px*vec2(d,0)), c=sampleCam(uv+px*vec2(0,-d)), e=sampleCam(uv+px*vec2(0,d));
    float ed = length(a-b)+length(c-e); vec3 line = vec3(1.-smoothstep(0.1,0.5,ed*2.));
    col = mix(col, line, edges);
  }

  // ---- temporal: ghost / smear (uses previous output frame) ----
  if(ghost>0.) col = mix(col, samplePrev(v), ghost*0.85);
  if(rainbow>0.){ vec3 pv = hueRot(samplePrev(v + (v-0.5)*0.01*rainbow), 0.35*rainbow); col = max(col, pv*mix(1.,0.96,1.-rainbow)); col = mix(col, pv, rainbow*0.55); }
  if(outline>0.){ float d=1.5; vec3 a=sampleCam(uv+px*vec2(-d,0)), b=sampleCam(uv+px*vec2(d,0)), c2=sampleCam(uv+px*vec2(0,-d)), e=sampleCam(uv+px*vec2(0,d));
                  float ed = length(a-b)+length(c2-e); col *= 1.-smoothstep(0.15,0.45,ed*2.)*outline; }
  if(smear>0.){ float keep = step(1.-smear*0.6, hash(floor(v*vec2(12.,9.))+floor(t*3.)));
                col = mix(col, samplePrev(v + vec2(0.002,0.)*smear), keep*0.93*smear); }

  // ---- colour grading ----
  float luma = dot(col, vec3(.299,.587,.114));
  col = mix(vec3(luma), col, saturation);
  col = (col-.5)*contrast+.5;
  col *= brightness;
  if(sepia>0.) col = mix(col, vec3(luma)*vec3(1.2,1.,0.75), sepia);
  if(yellow>0.){ col = mix(col, col*vec3(1.15,1.05,0.65)+vec3(.08,.07,0.), yellow*0.8); }
  if(mono>0.) col = mix(col, vec3(dot(col,vec3(.299,.587,.114))), mono);
  if(nightvision>0.){ float l = dot(col,vec3(.299,.587,.114)); l = pow(l*1.3,0.8);
                      col = mix(col, vec3(l*0.25, l*1.0, l*0.3), nightvision); }
  if(thermal>0.){ float l = dot(col,vec3(.299,.587,.114));
                  vec3 tc = l<0.25? mix(vec3(0,0,.3),vec3(0,.3,1.),l*4.) : l<0.5? mix(vec3(0,.3,1.),vec3(0,1,.3),(l-.25)*4.) : l<0.75? mix(vec3(0,1,.3),vec3(1,1,0),(l-.5)*4.) : mix(vec3(1,1,0),vec3(1,1,1),(l-.75)*4.);
                  col = mix(col, tc, thermal); }
  if(hueCycle>0.) col = hueRot(col, t*hueCycle*2.5);
  if(chromaWave>0.){ float l = dot(col,vec3(.299,.587,.114)); vec3 w = 0.5+0.5*vec3(sin(l*8.+t*2.), sin(l*8.+t*2.+2.09), sin(l*8.+t*2.+4.18)); col = mix(col, w*(0.4+l), chromaWave); }
  if(solarize>0.){ vec3 s = mix(col, 1.-col, step(0.5,col)); col = mix(col, s, solarize); }
  if(irGlow>0.){ float l = dot(col,vec3(.299,.587,.114)); float bloom = smoothstep(0.55,1.,l); col = mix(col, vec3(l)+bloom*0.6, irGlow); col = mix(col, col*vec3(1.,1.,0.95), irGlow*0.5); }
  if(gameboy>0.){ float l = dot(col,vec3(.299,.587,.114)); float d = (bayer4(v*res/max(1.,pixelate*40.))-.5)*0.25; float q = floor((l+d)*3.999)/3.;
                  vec3 gb = q<0.34? mix(vec3(.06,.22,.06),vec3(.19,.38,.19),q*3.) : q<0.67? vec3(.55,.67,.06) : vec3(.61,.74,.06);
                  col = mix(col, gb, gameboy); }
  if(nes>0.){ float d = (bayer4(v*res/max(1.,pixelate*40.))-.5)*0.3; vec3 q = floor((col+d)*3.999)/3.; q.b = floor((col.b+d)*1.999)/1.; col = mix(col, q, nes); }
  if(psx>0.){ float d = (bayer4(v*res/6.)-.5)/16.; col = mix(col, floor((col+d)*31.)/31., psx); }
  if(halftone>0.){ float l = dot(col,vec3(.299,.587,.114)); float cell = mix(12.,5.,halftone); vec2 hp = v*res/cell; vec2 f = fract(hp)-.5; float r = length(f)*1.35;
                   float dot_ = 1.-smoothstep(l-0.08, l+0.08, r); col = mix(col, mix(vec3(0.1), col*1.2, dot_), halftone*0.8); }
  if(posterize>0.){ float lv = mix(64., 3., posterize); col = mix(col, floor(col*lv+.5)/lv, min(1.,posterize*4.)); }

  // ---- overlays ----
  if(scanlines>0.){ float s = sin(v.y*res.y*3.14159)*.5+.5; col *= 1.-scanlines*0.35*s; }
  if(crt>0.){ float ph = mod(floor(v.x*res.x), 3.); vec3 m = vec3(ph<1.?1.:0.55, ph<2.&&ph>=1.?1.:0.55, ph>=2.?1.:0.55); col *= mix(vec3(1.), m*1.15, crt*0.6);
              vec2 c = abs(uv-0.5)*2.; float edge = smoothstep(1.0,0.96,max(c.x,c.y)); col *= mix(1., edge, crt);
              col *= 1.-crt*0.15*step(0.5,fract(v.y*res.y*0.5 + t*30.)); }
  if(motionBox>0.){ vec2 bc = vec2(0.3+0.4*hash1(floor(t*0.7)), 0.35+0.3*hash1(floor(t*0.7)+3.)); vec2 bs = vec2(0.12+0.15*hash1(floor(t*0.7)+7.), 0.2+0.2*hash1(floor(t*0.7)+9.));
                    vec2 dd = abs(v-bc)-bs; float inside = step(max(dd.x,dd.y),0.); float border = inside*(1.-step(max(dd.x,dd.y),-0.004)); float on = step(0.3, hash1(floor(t*0.7)+5.));
                    col = mix(col, vec3(0.2,1.,0.3), border*on*motionBox); }
  if(strobe>0.){ float on = step(1.-strobe*0.5, hash1(floor(t*12.))); col = mix(col, 1.-col*0.2, on*strobe); }
  if(interlace>0.){ float line = mod(floor(v.y*res.y), 2.); float offs = (line<1.)?0.:1.;
                    vec3 other = sampleCam(uv+vec2(0.004*interlace*(hash1(ft)-.5)*4., 0.));
                    col = mix(col, mix(col,other,offs), interlace*0.6); col *= 1.-interlace*0.18*line; }
  if(tapeNoise>0.){ float n = hash(vec2(v.x*res.x, v.y*res.y)+fract(t)*100.);
                    float streak = step(0.995 - tapeNoise*0.02, noise(vec2(t*60., v.y*300.)));
                    col = mix(col, vec3(n), tapeNoise*0.25*n);
                    col += streak*tapeNoise*vec3(0.8);
                    // white dropout lines
                    float drop = step(0.998 - tapeNoise*0.004, hash(vec2(floor(v.y*res.y), ft)));
                    col = mix(col, vec3(1.), drop*step(0.4, noise(vec2(v.x*8.+ft, 0.)))); }
  if(scratches>0.){ float sx = hash1(floor(t*8.)); float sc = step(1.-scratches*0.9, hash1(floor(t*8.)+1.)) * (1.-smoothstep(0.,0.003,abs(v.x-sx)));
                    col += sc*0.8;
                    float dust = step(0.9995-scratches*0.0005, hash(floor(v*res/2.)+ft)); col -= dust*0.9; }
  if(flicker>0.){ col *= 1. - flicker*0.5*step(0.75, noise(vec2(t*20.,2.))) * hash1(ft); col *= 1.-flicker*0.15*hash1(ft*.3); }
  if(grain>0.){ float g = hash(v*res+fract(t*7.)*10.)-.5; col += g*grain*0.5; }
  if(invertFlash>0.){ if(hash1(ft) < invertFlash*0.12) col = 1.-col; }
  if(vignette>0.){ float d = distance(v, vec2(.5)); col *= 1.-smoothstep(0.35, 0.95, d)*vignette*1.3; }

  gl_FragColor = vec4(clamp(col,0.,1.),1.);
}`;

// ============================================================
//  APP
// ============================================================
const $ = s=>document.querySelector(s);
const video=$('#video'), canvas=$('#gl'), overlay=$('#overlay'), splash=$('#splash'), errEl=$('#err');
const state = {}; for(const k in PARAMS) state[k]=PARAMS[k].def;
let preset = PRESETS[0], facing='environment', flipX=false, stamp=localStorage.getItem('fff-stamp')||'';
let gl, prog, fbA, fbB, texCam, texMask, texBG, uni={};
let recorder=null, chunks=[], stream=null;

// ---------- WebGL setup ----------
function initGL(){
  gl = canvas.getContext('webgl',{preserveDrawingBuffer:true, antialias:false});
  if(!gl) throw new Error('WebGL not available');
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s;};
  prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG)); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const names=['tex','prev','mask','bg','bgMode','maskSoft','maskShift','bgScroll','res','t','flipX',...Object.keys(PARAMS)];
  names.forEach(n=>uni[n]=gl.getUniformLocation(prog,n));
  texCam=mkTex(); texMask=mkTex(); texBG=mkTex(); gl.uniform1i(uni.tex,0); gl.uniform1i(uni.prev,1); gl.uniform1i(uni.mask,2); gl.uniform1i(uni.bg,3);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,texMask); gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,1,1,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,new Uint8Array([255]));
}
function mkTex(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); return t; }
function mkFB(w,h){ const t=mkTex(); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {f,t,w,h}; }
function sizeCanvas(){
  const vw=video.videoWidth||640, vh=video.videoHeight||480;
  const maxW=1280; const s=Math.min(1,maxW/vw);
  const w=Math.round(vw*s), h=Math.round(vh*s);
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; fbA=mkFB(w,h); fbB=mkFB(w,h); }
}

// ---------- render loop ----------
const t0=performance.now();
function frame(){
  requestAnimationFrame(frame);
  if(video.readyState<2) return;
  sizeCanvas();
  const t=(performance.now()-t0)/1000;
  gl.useProgram(prog); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texCam);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fbB.t);
  updateMask();
  gl.uniform1f(uni.bgMode, bgActive ? BGS[bgIdx].mode : 0); gl.uniform1f(uni.maskSoft,bgState.soft); gl.uniform1f(uni.maskShift,bgState.shift); gl.uniform1f(uni.bgScroll,1);
  gl.uniform2f(uni.res,canvas.width,canvas.height); gl.uniform1f(uni.t,t); gl.uniform1f(uni.flipX,flipX?1:0);
  for(const k in PARAMS) gl.uniform1f(uni[k],state[k]);
  // render to fbA (becomes "prev" next frame) then blit to screen by drawing again
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbA.f); gl.viewport(0,0,canvas.width,canvas.height); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  [fbA,fbB]=[fbB,fbA];
  drawOSD(t); tickMutate(t);
}

// ---------- on-screen text ----------
let osdMode='none';
function drawOSD(t){
  if(osdMode==='none'){ if(overlay.innerHTML) overlay.innerHTML=''; return; }
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const time=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const date=`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
  const rec = recorder ? '<span class="dot"></span>REC' : (osdMode==='vhs'?'▶ PLAY':'');
  overlay.id = 'osdFont-'+(osdMode==='vhs'?'vhs':'cam');
  const tick=Math.floor(t);
  let html='';
  if(osdMode==='vhs'||osdMode==='cam'){
    const lbl = stamp || (osdMode==='vhs'?'SP':'CAM 01');
    html = `<div class="osd tl">${rec}</div><div class="osd tr">${lbl}</div><div class="osd bl">${date}</div><div class="osd br">${time}</div>`;
  } else if(osdMode==='cctv'){
    const lbl = stamp || 'CAM 04 · NORTH ENTRANCE'; const mot = (tick%7<3) ? '<span style="color:#4f6">MOTION DETECTED</span>' : '';
    html = `<div class="osd tl">${recorder?'<span class="dot"></span>':''}${lbl}</div><div class="osd tr">${date} ${time}</div><div class="osd bl">${mot}</div><div class="osd br">ID ${String(1000+tick%9000)}</div>
      <div class="brk tl"></div><div class="brk tr"></div><div class="brk bl"></div><div class="brk br"></div>`;
  } else if(osdMode==='body'){
    const lbl = stamp || 'UNIT 12 · OFFICER 3391'; const bat = 100 - (tick%100);
    html = `<div class="osd tl"><span class="dot"></span>${lbl}</div><div class="osd tr">BAT ${bat}% ▮▮▮${bat<40?'▯':'▮'}▯</div><div class="osd bl">${date} ${time}</div><div class="osd br">GPS LOCK · 10 fps</div>`;
  } else if(osdMode==='drone'){
    const lbl = stamp || 'UAV-07'; const alt=(120+Math.sin(t*0.3)*15).toFixed(0), hdg=Math.floor((t*4)%360), spd=(9+Math.sin(t*0.5)*3).toFixed(1);
    html = `<div class="osd tl">${lbl} · ${recorder?'<span class="dot"></span>REC':'LIVE'}</div><div class="osd tr">${time}</div><div class="osd bl">ALT ${alt}m · SPD ${spd}m/s</div><div class="osd br">HDG ${String(hdg).padStart(3,'0')}° · SAT 11</div>
      <div class="cross"></div><div class="hud-ring"></div><div class="hud-bar">${Array.from({length:19},(_,i)=>`<i style="height:${i%5==0?14:7}px"></i>`).join('')}</div>`;
  }
  overlay.innerHTML = html;
}

// ---------- camera ----------
async function startCamera(){
  errEl.style.display='none';
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const tries=[
    {video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:true},
    {video:{facingMode:{ideal:facing}},audio:true},
    {video:true,audio:false},
  ];
  let lastErr;
  for(const c of tries){ try{ stream=await navigator.mediaDevices.getUserMedia(c); break; }catch(e){ lastErr=e; } }
  if(!stream) throw lastErr||new Error('No camera');
  video.srcObject=stream; await video.play();
  const track=stream.getVideoTracks()[0]; const s=track.getSettings();
  flipX = (s.facingMode==='user') || (facing==='user' && !s.facingMode);
}
$('#start').onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API not available. Open this page over https (or localhost).');
    if(!gl) initGL();
    await startCamera();
    splash.style.display='none';

// ---------- mutate: sliders drift toward new random targets ----------
const mutate={on:false,speed:.5,next:0,targets:{}};
$('#mutate').onclick=()=>{ mutate.on=!mutate.on; mutate.next=0; $('#mutate').classList.toggle('on',mutate.on); buildSliders(); };
function tickMutate(t){
  if(!mutate.on) return;
  if(t>mutate.next){
    mutate.next = t + (1.5 + 8*(1-mutate.speed)) * (0.5+Math.random());
    const pool = preset.sliders;
    pool.forEach(k=>{ const P=PARAMS[k]; const keep = Math.random()<0.35; mutate.targets[k] = keep ? state[k] : P.min+Math.random()*(P.max-P.min); });
    // occasionally throw in a wildcard from the whole param set
    if(Math.random()<0.4){ const all=Object.keys(PARAMS); const k=all[Math.floor(Math.random()*all.length)]; const P=PARAMS[k]; mutate.targets[k]= Math.random()<0.5 ? P.def : P.min+Math.random()*(P.max-P.min)*0.6; }
  }
  const rate = 0.02 + 0.08*mutate.speed;
  for(const k in mutate.targets){ state[k] += (mutate.targets[k]-state[k])*rate; }
  if(Math.floor(t*6)!==mutate.lastUI){ mutate.lastUI=Math.floor(t*6); refreshSliderUI(); }
}
function refreshSliderUI(){ for(const [k,{inp,out}] of Object.entries(sliderEls)){ if(document.activeElement===inp) continue; inp.value=state[k]; out.textContent=fmt(state[k]); } }

$('#record').onclick=()=>{ recorder ? stopRec() : startRec(); };
function startRec(){
  if(!window.MediaRecorder){ alert('Recording not supported in this browser.'); return; }
  const vs=canvas.captureStream(30);
  const audio=stream?.getAudioTracks()||[];
  const mixed=new MediaStream([...vs.getVideoTracks(),...audio]);
  const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  chunks=[]; recorder=new MediaRecorder(mixed, mime?{mimeType:mime}:undefined);
  recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{ const ext=(recorder.mimeType||mime).includes('mp4')?'mp4':'webm';
    saveBlob(new Blob(chunks,{type:recorder.mimeType||mime}),`super-video-${Date.now()}.${ext}`); recorder=null; $('#record').classList.remove('rec'); $('#record').textContent='● Rec'; };
  recorder.start(250); $('#record').classList.add('rec'); $('#record').textContent='■ Stop';
}
function stopRec(){ recorder.stop(); }

async function saveBlob(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'Super Video Filter'}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}

    const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    segmenter=await vision.ImageSegmenter.createFromOptions(files,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite', delegate:'GPU'},
      runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });

let maskBuf=null, lastSegT=-1;
function updateMask(){
  if(!bgActive||!segmenter||video.readyState<2) return;
  const now=performance.now(); if(now===lastSegT) return; lastSegT=now;
  let res; try{ res=segmenter.segmentForVideo(video, now); }catch(e){ return; }
  const m=res.confidenceMasks && res.confidenceMasks[0]; if(!m) return;
  const w=m.width, h=m.height, f=m.getAsFloat32Array();
  if(!maskBuf||maskBuf.length!==w*h) maskBuf=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) maskBuf[i]=f[i]*255;
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,texMask); gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,w,h,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,maskBuf);
  res.close && res.close();
}

// ---- scene painters (one-point perspective, drawn once) ----
function persp(cx,w,h,horizon){ // helper: map (x in -1..1, y in -1..1, depth 0..1) to screen
  return (x,y,d)=>{ const s=1-d*0.92; return [w/2 + x*w/2*s, horizon + y*h/2*s]; };
}
function paintBackrooms(cx,w,h){
  const P=persp(cx,w,h,h*0.5);
  const wall='#c9b34a', wallD='#a08c2e', carpet='#8a7a2c', carpetD='#6b5d1f', ceil='#d8cd93';
  // back wall
  const [bx0,by0]=P(-1,-1,1), [bx1,by1]=P(1,1,1);
  cx.fillStyle=wall; cx.fillRect(0,0,w,h);
  // ceiling
  cx.fillStyle=ceil; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(w,0); cx.lineTo(bx1,by0); cx.lineTo(bx0,by0); cx.fill();
  // floor
  cx.fillStyle=carpet; cx.beginPath(); cx.moveTo(0,h); cx.lineTo(w,h); cx.lineTo(bx1,by1); cx.lineTo(bx0,by1); cx.fill();
  // carpet noise
  for(let i=0;i<9000;i++){ const x=Math.random()*w, y=by1+Math.random()*(h-by1); cx.fillStyle=Math.random()<.5?carpetD:'#9c8b36'; cx.globalAlpha=.35; cx.fillRect(x,y,2,2); } cx.globalAlpha=1;
  // side walls with wallpaper stripes
  for(const side of [-1,1]){
    cx.fillStyle=wallD; cx.beginPath(); const [x0,y0]=P(side,-1,0),[x1,y1]=P(side,1,0),[x2,y2]=P(side,1,1),[x3,y3]=P(side,-1,1);
    cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.lineTo(x2,y2); cx.lineTo(x3,y3); cx.fill();
    cx.strokeStyle='rgba(0,0,0,.12)'; cx.lineWidth=2;
    for(let d=0;d<1;d+=0.06){ const [a,b]=P(side,-1,d),[c,e]=P(side,1,d); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); }
    cx.strokeStyle='rgba(255,255,255,.08)';
    for(let y=-1;y<1;y+=0.12){ const [a,b]=P(side,y,0),[c,e]=P(side,y,1); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); }
  }
  // back wall stripes + a doorway to nowhere
  cx.strokeStyle='rgba(0,0,0,.08)'; for(let x=bx0;x<bx1;x+=6){ cx.beginPath(); cx.moveTo(x,by0); cx.lineTo(x,by1); cx.stroke(); }
  cx.fillStyle='#6d5e1c'; cx.fillRect(bx0+(bx1-bx0)*0.62, by0+(by1-by0)*0.18, (bx1-bx0)*0.16, (by1-by0)*0.82);
  cx.fillStyle='#3a3110'; cx.fillRect(bx0+(bx1-bx0)*0.64, by0+(by1-by0)*0.22, (bx1-bx0)*0.12, (by1-by0)*0.78);
  // ceiling tiles + fluorescent panels
  cx.strokeStyle='rgba(0,0,0,.18)'; cx.lineWidth=2;
  for(let d=0;d<1;d+=0.07){ const [a,b]=P(-1,-1,d),[c,e]=P(1,-1,d); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); }
  for(let x=-1;x<=1;x+=0.25){ const [a,b]=P(x,-1,0),[c,e]=P(x,-1,1); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); }
  for(let d=0.04;d<0.9;d+=0.21){ for(const x of [-0.55,0.35]){
    const [a,b]=P(x,-1,d),[c,e]=P(x+0.2,-1,d+0.1); cx.fillStyle='#fffbe0'; cx.shadowColor='#fff6c0'; cx.shadowBlur=30; cx.fillRect(a,b,c-a,e-b); cx.shadowBlur=0; } }
  // haze/vignette
  const g=cx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,h*0.9); g.addColorStop(0,'rgba(255,240,180,0)'); g.addColorStop(1,'rgba(60,45,0,.55)'); cx.fillStyle=g; cx.fillRect(0,0,w,h);
}
function paintPool(cx,w,h){

    cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.lineTo(x2,y2); cx.lineTo(x3,y3); cx.fill();

    for(let y=-1;y<1;y+=0.1){ const [a,b]=P(side,y,0),[c,e]=P(side,y,1); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); } }
  cx.fillStyle='#f4f8f9'; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(w,0); cx.lineTo(bx1,by0); cx.lineTo(bx0,by0); cx.fill();
  cx.strokeStyle='rgba(120,160,175,.3)'; for(let x=bx0;x<bx1;x+=10){ cx.beginPath(); cx.moveTo(x,by0); cx.lineTo(x,by1); cx.stroke(); } for(let y=by0;y<by1;y+=10){ cx.beginPath(); cx.moveTo(bx0,y); cx.lineTo(bx1,y); cx.stroke(); }

  const g=cx.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(150,200,210,.5)'); cx.fillStyle=g; cx.fillRect(0,0,w,h);

function paintHall(cx,w,h){

  cx.fillStyle='#2b2b2e'; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(w,0); cx.lineTo(bx1,by0); cx.lineTo(bx0,by0); cx.fill();

}
function paintOffice(cx,w,h){

  cx.fillStyle='#8f8a80'; cx.beginPath(); cx.moveTo(0,h); cx.lineTo(w,h); cx.lineTo(bx1,by1); cx.lineTo(bx0,by1); cx.fill();
  cx.fillStyle='#ecebe6'; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(w,0); cx.lineTo(bx1,by0); cx.lineTo(bx0,by0); cx.fill();
  cx.strokeStyle='rgba(0,0,0,.15)'; cx.lineWidth=2;
  for(let d=0;d<1;d+=0.08){ const [a,b]=P(-1,-1,d),[c,e]=P(1,-1,d); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); const [a2,b2]=P(-1,1,d),[c2,e2]=P(1,1,d); cx.beginPath(); cx.moveTo(a2,b2); cx.lineTo(c2,e2); cx.stroke(); }
  for(let x=-1;x<=1;x+=0.2){ const [a,b]=P(x,-1,0),[c,e]=P(x,-1,1); cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,e); cx.stroke(); const [a2,b2]=P(x,1,0),[c2,e2]=P(x,1,1); cx.beginPath(); cx.moveTo(a2,b2); cx.lineTo(c2,e2); cx.stroke(); }
  for(const side of [-1,1]){ cx.fillStyle='#cfcbc1'; cx.beginPath(); const [x0,y0]=P(side,-1,0),[x1,y1]=P(side,1,0),[x2,y2]=P(side,1,1),[x3,y3]=P(side,-1,1); cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.lineTo(x2,y2); cx.lineTo(x3,y3); cx.fill(); }
  // cubicle partitions
  for(let d=0.15;d<0.9;d+=0.22){ for(const x of [-0.7,0.7]){ const [a,b]=P(x-0.25,0.05,d),[c,e]=P(x+0.25,1,d); cx.fillStyle='#8a97a6'; cx.fillRect(a,b,c-a,e-b); cx.fillStyle='#6f7c8a'; cx.fillRect(a,b,c-a,4); } }
  for(let d=0.04;d<0.9;d+=0.16){ for(const x of [-0.5,0.3]){ const [a,b]=P(x,-1,d),[c,e]=P(x+0.2,-1,d+0.06); cx.fillStyle='#ffffff'; cx.shadowColor='#fff'; cx.shadowBlur=20; cx.fillRect(a,b,c-a,e-b); cx.shadowBlur=0; } }
  const g=cx.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(40,40,50,.5)'); cx.fillStyle=g; cx.fillRect(0,0,w,h);
}
buildBGs();

// stop iOS double-tap / pinch zoom (touch-action alone isn't enough on older iPadOS)
let lastTap=0;
document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTap<350 && e.target.tagName!=='INPUT'){ e.preventDefault(); } lastTap=now; },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});

// restore last preset
const saved=PRESETS.find(p=>p.id===localStorage.getItem('fff-preset'));
applyPreset(saved||PRESETS[1]);
if(!window.isSecureContext) { errEl.textContent='Cameras only work on https or localhost.'; errEl.style.display='block'; }
</script>
